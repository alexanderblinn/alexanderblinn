<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="$description">
  <meta name="theme-color" content="#faf9f6">
  <title>$title</title>
  <link rel="canonical" href="$canonical">
  <link rel="icon" href="/assets/site/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/site/style.css">
  <link rel="alternate" type="application/rss+xml" title="Alexander Blinn — Journal" href="/feed.xml">
  $extra_head
</head>
<body>
  <a class="skip-link" href="#content">Zum Inhalt</a>
  <div class="page $page_class">
    <header class="site-header">
      <a class="site-name" href="/">Alexander Blinn<span class="cursor" aria-hidden="true">_</span></a>
      <p class="tagline">Regelung / Optimierung / Energiesysteme</p>
      <nav aria-label="Hauptnavigation">$navigation</nav>
    </header>
    <main id="content" tabindex="-1">$content</main>
    <footer class="site-footer">
      <p>Alexander Blinn · <a href="$github">GitHub</a> · <a href="/feed.xml">RSS</a></p>
      <p class="colophon">Ein persönliches Arbeitsjournal. Immer in Arbeit.</p>
    </footer>
  </div>
</body>
</html>
