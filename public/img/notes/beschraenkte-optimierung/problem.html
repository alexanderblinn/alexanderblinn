<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Das Beispielproblem — interaktive Abbildung</title>
  <link rel="stylesheet" href="/assets/notes/beschraenkte-optimierung/style.css">
  <script type="module" src="/assets/notes/beschraenkte-optimierung/problem.mjs"></script>
</head>
<body>
<main id="experiment">
  <div class="experiment-heading"><span>DAS BEISPIEL / MINIMUM ÜBER Ω</span><span id="live-state"></span></div>
  <svg id="plot" class="plot" viewBox="0 0 680 470" role="group" aria-labelledby="plot-title plot-description">
    <title id="plot-title">Höhenlinien von f, der zulässige Bereich Ω und das beschränkte Minimum x*</title>
    <desc id="plot-description">Die Höhenlinien von f sind Ellipsen um das unbeschränkte Minimum x_ref, das sich ziehen lässt. Ω ist die Kreisscheibe vom Radius 2, oben abgeschnitten durch die Gerade x₂ = 1,2 und unten links ausgespart durch einen kleinen Kreis. Der schwarze Punkt x* ist das Minimum von f über Ω; die gestrichelte Höhenlinie durch x* berührt Ω dort, und die Grenzen der aktiven Nebenbedingungen sind orange.</desc>
    <rect width="680" height="470" fill="#faf9f6"/>
    <g id="grid" class="grid"></g>
    <g id="omega"></g>
    <g id="contours"></g>
    <ellipse id="level" fill="none" stroke="#8a5979" stroke-width="1.8" stroke-dasharray="7 5"/>
    <g id="labels"></g>
    <path id="link" fill="none" stroke="#8a5979" stroke-width="1.2" stroke-dasharray="2 4"/>
    <g id="optimum"><rect x="-7" y="-7" width="14" height="14" transform="rotate(45)" fill="#252525" stroke="#faf9f6" stroke-width="1.5"/></g>
    <text id="optimum-label" style="fill:#252525;font-weight:bold;paint-order:stroke;stroke:#faf9f6;stroke-width:4px">x*</text>
    <g id="target" class="handle" role="slider" tabindex="0" aria-label="Unbeschränktes Minimum x_ref verschieben" aria-valuetext="">
      <circle class="hit-area" r="24"/>
      <circle r="9" fill="#faf9f6" stroke="#8a5979" stroke-width="2"/>
      <path d="M-13 0h26M0 -13v26" stroke="#8a5979" stroke-width="2"/>
    </g>
    <text id="target-label" style="fill:#8a5979;font-weight:bold;paint-order:stroke;stroke:#faf9f6;stroke-width:4px">x<tspan dy="4" font-size="11">ref</tspan></text>
  </svg>
  <div class="legend" aria-label="Legende">
    <span><i class="key box"></i>zulässiger Bereich Ω</span>
    <span><i class="key" style="border-color:#647e83"></i>Höhenlinien von f</span>
    <span><i class="key" style="border-color:#8a5979;border-top-style:dashed"></i>Höhenlinie durch x*</span>
    <span><i class="key" style="border-color:#b95a28;border-top-width:4px"></i>aktive Grenze</span>
  </div>
  <div class="controls">
    <button id="reset" type="button">Zurücksetzen ↺</button>
  </div>
  <p id="status" class="visually-hidden" role="status" aria-live="polite"></p>
  <noscript>Für die Abbildung ist JavaScript erforderlich. Die Erklärung steht im Beitrag.</noscript>
</main>
</body>
</html>
