<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zulässiger Bereich und aktive Menge — interaktive Abbildung</title>
  <link rel="stylesheet" href="/assets/notes/beschraenkte-optimierung/style.css">
  <script type="module" src="/assets/notes/beschraenkte-optimierung/aktiv.mjs"></script>
</head>
<body>
<main id="experiment">
  <div class="experiment-heading"><span>ZULÄSSIGER BEREICH / AKTIVE MENGE</span><span id="live-state">𝒜(x) = { }</span></div>
  <svg id="plot" class="plot" viewBox="0 0 680 480" role="group" aria-labelledby="plot-title plot-description">
    <title id="plot-title">Der zulässige Bereich Ω des Beispiels und ein verschiebbarer Punkt x</title>
    <desc id="plot-description">Ω ist die Kreisscheibe vom Radius 2, oben abgeschnitten durch die Gerade x₂ = 1,2 und unten links ausgespart durch einen kleinen Kreis. Der blaue Punkt x lässt sich ziehen; in der Nähe einer Grenze oder Ecke rastet er auf ihr ein. Die Grenzen der gerade aktiven Nebenbedingungen sind orange hervorgehoben, darunter stehen die Werte cᵢ(x).</desc>
    <rect width="680" height="480" fill="#faf9f6"/>
    <g id="grid" class="grid"></g>
    <g id="omega"></g>
    <g id="labels"></g>
    <g id="point" class="handle" role="slider" tabindex="0" aria-label="Punkt x verschieben" aria-valuetext="">
      <circle class="hit-area" r="24"/><circle r="7.5" fill="#173fbe" stroke="#faf9f6" stroke-width="2"/>
    </g>
  </svg>
  <div id="readout" class="readout" aria-hidden="true"></div>
  <p id="status" class="visually-hidden" role="status" aria-live="polite"></p>
  <noscript>Für die Abbildung ist JavaScript erforderlich. Die Erklärung steht im Beitrag.</noscript>
</main>
</body>
</html>
