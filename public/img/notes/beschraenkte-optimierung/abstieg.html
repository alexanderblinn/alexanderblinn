<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zulässige Abstiegsrichtungen — interaktive Abbildung</title>
  <link rel="stylesheet" href="/assets/notes/beschraenkte-optimierung/style.css">
  <script type="module" src="/assets/notes/beschraenkte-optimierung/abstieg.mjs"></script>
</head>
<body>
<main id="experiment">
  <div class="experiment-heading"><span>ZULÄSSIGE ABSTIEGSRICHTUNGEN / EINE NEBENBEDINGUNG</span><span id="live-state"></span></div>
  <svg id="plot" class="plot" viewBox="0 0 680 460" role="group" aria-labelledby="plot-title plot-description">
    <title id="plot-title">Abstiegsrichtungen und zulässige Richtungen an einem Punkt des Kreises c₁(x) = 0</title>
    <desc id="plot-description">Höhenlinien von f um das unbeschränkte Minimum x_ref und der Kreis vom Radius 2. Der blaue Punkt x lässt sich auf dem Kreis verschieben. Um ihn herum zeigt eine Richtungsrose die Abstiegsrichtungen (blau), die zulässigen Richtungen (grün: bei c₁(x) = 0 nur die Tangente, bei c₁(x) ≤ 0 die Hälfte nach innen) und deren gemeinsame Richtungen (orange). Wo die Höhenlinie durch x den Kreis berührt, gibt es keine gemeinsame Richtung mehr.</desc>
    <defs>
      <marker id="arrow-target" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8a5979"/></marker>
      <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#426f6b"/></marker>
      <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b95a28"/></marker>
    </defs>
    <rect width="680" height="460" fill="#faf9f6"/>
    <g id="grid" class="grid"></g>
    <circle id="disk" fill="#e5eeeb" fill-opacity=".85"/>
    <g id="contours"></g>
    <ellipse id="level" fill="none" stroke="#8a5979" stroke-width="1.6" stroke-dasharray="6 5"/>
    <circle id="circle" fill="none" stroke="#426f6b"/>
    <g id="static"></g>
    <g id="rose"></g>
    <g id="vectors"></g>
    <g id="point" class="handle" role="slider" tabindex="0" aria-label="Punkt x auf dem Kreis verschieben" aria-valuemin="0" aria-valuemax="359" aria-valuenow="0" aria-valuetext="">
      <circle class="hit-area" r="24"/><circle r="7.5" fill="#173fbe" stroke="#faf9f6" stroke-width="2"/>
    </g>
  </svg>
  <div class="legend" aria-label="Legende">
    <span><i class="key" style="border-color:#8a5979"></i>−∇f(x)</span>
    <span><i class="key" style="border-color:#426f6b"></i>∇c₁(x)</span>
    <span><i class="key box" style="background:rgba(23,63,190,.16);border-color:#173fbe"></i>Abstiegsrichtungen</span>
    <span><i class="key box" style="background:rgba(66,111,107,.32)"></i>zulässige Richtungen</span>
    <span><i class="key box" style="background:rgba(185,90,40,.7);border-color:#b95a28"></i>zulässig und abwärts</span>
  </div>
  <div class="controls">
    <div class="switch" role="group" aria-label="Art der Nebenbedingung">
      <button type="button" data-mode="equality" aria-pressed="false">c₁(x) = 0</button><button type="button" data-mode="inequality" aria-pressed="true">c₁(x) ≤ 0</button>
    </div>
  </div>
  <p id="status" class="visually-hidden" role="status" aria-live="polite"></p>
  <noscript>Für die Abbildung ist JavaScript erforderlich. Die Erklärung steht im Beitrag.</noscript>
</main>
</body>
</html>
